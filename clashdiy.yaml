    proxies: *G
    
  # 👇 迪士尼流媒体解锁专线配置，强制默认首选新加坡/美国高解锁区
  - name: Disney+
    type: select
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/DisneyPlus.png
    proxies: [新加坡节点, 香港节点, 美国节点, 台湾节点, 日本节点, 韩国节点, 手动选择, 节点选择]

