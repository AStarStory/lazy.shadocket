# =========================================
# 7. 终极路由与分流规则 (由上至下严格匹配)
# =========================================
rules:
  # --- 0. 个人绝对直连白名单 ---
  # 工作核心资产与敏感金融服务，强制走本地物理宽带防止被杀或封号
  - DOMAIN-SUFFIX,modao.cc,DIRECT
  - DOMAIN-KEYWORD,bank,DIRECT
  - DOMAIN-SUFFIX,alipay.com,DIRECT

  # --- 1. 进程级防卡顿白名单 ---
  # 彻底解决开启 TUN 后，远程控制、内网穿透、语音会议软件掉线或卡顿问题
  - PROCESS-NAME,SunloginClient.exe,DIRECT
  - PROCESS-NAME,ToDesk.exe,DIRECT
  - PROCESS-NAME,TeamViewer.exe,DIRECT
  - PROCESS-NAME,wemeetapp.exe,DIRECT
  - PROCESS-NAME,tailscaled.exe,DIRECT
  - PROCESS-NAME,zerotier-one.exe,DIRECT

  # --- 2. 🎯 你的专属独立服务器路由 ---
  # 确保你设计的 EAM 系统和阿里云控制台环境稳定连接，强制回流香港专线
  - DOMAIN-SUFFIX,lege.freeddns.org,香港节点
  - DOMAIN-SUFFIX,lege.jishutech.cn,香港节点
  - DOMAIN-SUFFIX,ecs.console.aliyun.com,香港节点
  - IP-CIDR,8.155.3.90/32,香港节点,no-resolve

  # --- 2.5 流媒体强绑防漏网补丁 (专治迪士尼锁区) ---
  # 强行拦截迪士尼极易漏网的登录验证底层 API，确保分配至正确的解锁大区
  - DOMAIN-KEYWORD,disney,Disney+
  - DOMAIN-KEYWORD,bamgrid,Disney+
  - DOMAIN-SUFFIX,dssott.com,Disney+
  - DOMAIN-SUFFIX,disneystreaming.com,Disney+
  - DOMAIN-SUFFIX,starott.com,Disney+
  - DOMAIN-SUFFIX,star.biz,Disney+

  # --- 3. 节点与规则库自身更新流量 ---
  # 防止无法拉取最新规则或订阅
