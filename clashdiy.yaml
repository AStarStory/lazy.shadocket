# =========================================
# 1. 核心基础参数与 Mihomo 稳定化优化
# =========================================
# 基础服务端口设置，保留默认以确保兼容性
port: 7897
socks-port: 7891
mixed-port: 7893
# 默认关闭局域网共享，保障本地网络安全
allow-lan: false
# 运行模式：rule(规则分流)、global(全局)、direct(直连)
mode: rule
# 日志级别：日常使用建议 info；排障时再临时切到 debug 或 warning
log-level: info
# 外部控制面板监听地址
external-controller: 127.0.0.1:9090
secret: ""

# --- Mihomo 内核常用增强 ---
# 统一延迟计算，策略组（特别是 url-test 和 fallback）测速更稳定精准
unified-delay: true
# TCP 并发：并发尝试多个节点 IP，极大提升首次连接成功率
tcp-concurrent: true
# 进程匹配模式：提升 PROCESS-NAME 类规则（如向日葵、ToDesk白名单）的准确性
find-process-mode: strict

profile:
  # 重载配置后，记忆之前手动选中的策略组节点
  store-selected: true
  # 记忆 Fake-IP 映射表，减少重启或重载配置后的短暂断流现象
  store-fake-ip: true

# --- Geo 数据库自动更新策略 ---
geodata-mode: true
# 内存控制机制：常规设备建议 standard；如果是极低内存设备（如早期软路由）可改 memconservative
geodata-loader: standard
geo-auto-update: true
# Geo 数据库每 24 小时自动更新一次，确保地区与应用判定准确
geo-update-interval: 24
geox-url:
  geoip: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat"
  geosite: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat"
  asn: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/GeoLite2-ASN.mmdb"
  mmdb: "https://github.com/Hackl0us/GeoIP2-CN/releases/latest/download/Country.mmdb"

# =========================================
# 2. 高级网络接管 (TUN 虚拟网卡与嗅探)
# =========================================
tun:
  # TUN 模式总开关：是否实际生效仍以 Clash Verge Rev 面板 UI 的开关状态为准
  enable: false
  # 网络栈：桌面端通用性较好，优先推荐 mixed
  stack: mixed
  # 开启 TUN 时劫持系统 DNS，防止 DNS 泄漏，请求统一交给 Mihomo 处理
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  # 自动重定向：Linux 支持更完整；Windows 视内核能力生效
  auto-redirect: true
  auto-detect-interface: true
  # GSO 优化：偏向底层性能提升；如遇某些老旧软件兼容性问题可关闭
  gso: true
  gso-max-size: 65536

# --- 流量嗅探 (Sniffer) ---
# 核心作用：修正部分 App (如流媒体) 写死底层 IP 导致的分流失效，强行还原域名
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, '8080-8880']
    QUIC:
      ports: [443, 8443]
  force-domain:
    # 强制嗅探列表：覆盖谷歌、油管、脸书系的核心底层通讯
    - '+.google.com'
    - '+.googleapis.com'
    - '+.googleusercontent.com'
    - '+.youtube.com'
    - '+.facebook.com'
    - '+.messenger.com'
    - '+.fbcdn.net'
    - 'fbcdn-a.akamaihd.net'
  skip-domain:
    # 嗅探白名单：智能家居等局域网设备建议跳过，避免通讯异常
    - 'Mijia Cloud'
    - '+.push.apple.com'   # 防止苹果推送消息被嗅探误杀，确保通知秒到

# =========================================
# 3. DNS 防污染与极速解析体系
# =========================================
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  # 增强模式：推荐 fake-ip，极速响应 DNS 请求，是网页秒开的核心
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: true
  # 尊重分流规则：DNS 解析结果跟随分流策略，从根本上减少 DNS 泄漏风险
  respect-rules: true
  prefer-h3: false
  # 缓存算法：arc 能在缓存命中率与内存占用之间取得较好平衡
  cache-algorithm: arc

  # --- 引导 DNS ---
  # 仅用于解析下方 DoH/DoT 域名的真实 IP，稳定优先，首选国内高可用 DNS
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # --- 主解析器 ---
  # 常规域名优先使用国内 DoH 加密解析，提高国内访问速度与稳定性
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # --- 代理专用解析器 ---
  # 专用于解析代理节点域名，混合国内与海外 Google 解析器以提升全局兼容性
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    - https://dns.google/dns-query

  # --- 直连解析器 ---
  # 指定直接连接流量使用的 DNS
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

  # --- 兜底回退解析器 ---
  # 主要用于国外被污染域名，或主解析器异常时的紧急兜底
  fallback:
    - tls://1.1.1.1:853
    - tls://8.8.8.8:853
    - tls://9.9.9.9:853
    - https://dns.google/dns-query

  # --- 域名分流解析策略 (nameserver-policy) ---
  # 按域名类别指定解析路径，实现国内外 DNS 完全物理隔离，避免混用污染
  nameserver-policy:
    "geosite:private,cn,apple,apple-cn,microsoft@cn,onedrive,steam@cn,category-games@cn":
      - https://doh.pub/dns-query
      - https://223.5.5.5/dns-query
    "geosite:geolocation-!cn":
      - tls://1.1.1.1:853
      - tls://8.8.8.8:853

  # --- Rule 模式 Fake-IP 过滤名单 (防断流核心) ---
  # 原则：局域网通讯、国内常用检测站点、时间同步服务等，必须强行返回真实 IP
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - GEOSITE,private,real-ip
    - GEOSITE,cn,real-ip
    - DOMAIN,localhost.ptlogin2.qq.com,real-ip
    - DOMAIN,localhost.sec.qq.com,real-ip
    - DOMAIN,localhost.work.weixin.qq.com,real-ip
    - DOMAIN-SUFFIX,msftconnecttest.com,real-ip
    - DOMAIN-SUFFIX,msftncsi.com,real-ip
    - DOMAIN,detectportal.firefox.com,real-ip
    - DOMAIN,captive.apple.com,real-ip
    - DOMAIN,pool.ntp.org,real-ip
    - DOMAIN,time.windows.com,real-ip
    - DOMAIN,resolver1.opendns.com,real-ip
    - DOMAIN-WILDCARD,time.*.com,real-ip
    - DOMAIN-WILDCARD,time.*.gov,real-ip
    - DOMAIN-WILDCARD,ntp.*.com,real-ip
    - DOMAIN-WILDCARD,*.ntp.org.cn,real-ip
    - MATCH,fake-ip

# =========================================
# 4. 节点提供者 (远程订阅接入)
# =========================================
# 统一管理和更新您的 Sub-Store 私密订阅或机场链接
proxy-providers:
  All:
    type: http
    url: "https://gist.githubusercontent.com/AStarStory/3523c833b7e92e87eeda820f2555a837/raw/Keliang"
    interval: 86400
    path: ./all.yaml
    health-check:
      enable: true
      interval: 600
      url: "https://www.gstatic.com/generate_204"

# =========================================
# 5. 策略组编排 (UI 面板显示的分组与权重)
# =========================================
proxy-groups:
  # --- 基础控制枢纽 ---
  - name: 节点选择
    type: select
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/adjust.svg
    use: [All]
    proxies: [自动选择, 故障转移, 负载均衡(散列), 负载均衡(轮询), 香港节点, 日本节点, 美国节点, 台湾节点, 新加坡节点, 韩国节点]

  - name: 手动选择
    type: select
    icon: https://www.clashverge.dev/assets/icons/link.svg
    use: [All]
    # 显式补全 proxies 以绕过 GUI 严格校验
    proxies: []

  # --- 自动化测速与高可用组 ---
  - name: 自动选择
    type: url-test
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/speed.svg
    use: [All]
    proxies: []
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: 故障转移
    type: fallback
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/ambulance.svg
    use: [All]
    proxies: []
    url: "https://www.gstatic.com/generate_204"
    interval: 300

  - name: 负载均衡(散列)
    type: load-balance
    strategy: consistent-hashing
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/merry_go.svg
    use: [All]
    proxies: []
    url: "https://www.gstatic.com/generate_204"
    interval: 300

  - name: 负载均衡(轮询)
    type: load-balance
    strategy: round-robin
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/balance.svg
    use: [All]
    proxies: []
    url: "https://www.gstatic.com/generate_204"
    interval: 300

  # --- 场景化与业务逻辑分组 ---
  - name: 国外网站
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
    # 定义 &G 母版，统一包含常用控制组件
    proxies: &G [节点选择, 手动选择, 自动选择, 故障转移, 负载均衡(散列), 负载均衡(轮询), 香港节点, 日本节点, 美国节点, 台湾节点, 新加坡节点, 韩国节点]

  - name: 国内网站
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China_Map.png
    # 定义 &C 母版，优先保证直连，节点选择备用
    proxies: &C [DIRECT, 节点选择, 自动选择, 香港节点, 台湾节点, 新加坡节点]

  # 👇 大部分常规服务继承 *G 母版逻辑
  - name: AI合集
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/63be653774a6a83cd8e475a7b65f1ed68b9a0093/IconSet/Color/AI.png
    proxies: *G
    
  # 👇 OpenAI 严格审计港区 IP，打乱默认排序，首选非港区节点
  - name: OpenAI
    type: select
    icon: https://raw.githubusercontent.com/chxm1023/Script_X/main/icon/ChatGPT/ChatGPT5.png
    proxies: [美国节点, 日本节点, 新加坡节点, 台湾节点, 手动选择, 节点选择]
    
  - name: Telegram
    type: select
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png
    proxies: *G
    
  - name: Github
    type: select
    icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/github_07.png
    proxies: *G
    
  # 👇 TikTok 强封锁环境，默认优先排挤香港，首选新、美、日
